name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Integration tests run the real Collector; cache the verified download.
  OTEL_TEST_CACHE_DIR: ${{ github.workspace }}/.otel-test-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .otel-test-cache
          # Bump together with binary::PINNED_VERSION.
          key: otelcol-contrib-0.164.0-${{ runner.os }}-${{ runner.arch }}
      - run: cargo test --workspace
      - name: Real-world examples (positive and negative)
        if: runner.os != 'Windows'
        run: |
          cargo build --release
          OTEL_TEST=target/release/otel-test examples/real-world/verify.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
