[workspace]
resolver = "3"
members = ["crates/otel-test-cli", "crates/otel-test-core", "crates/otel-test-capture"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
keywords = ["opentelemetry", "otel", "collector", "testing", "observability"]
categories = ["development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
otel-test-core = { path = "crates/otel-test-core", version = "0.1.0" }
otel-test-capture = { path = "crates/otel-test-capture", version = "0.1.0" }

anstream = "1.0.0"
anstyle = "1.0.14"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs", "with-serde"] }
prost = "0.14.4"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.9", default-features = false, features = ["server", "router", "codegen"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
